<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kvest-map</title>
    <link rel="stylesheet" href="style/styles.css">
</head>
<body>
    <!-- Навигация по отделам -->
    <nav class="navbar">
        <button class="nav-btn active" data-tab="section-1">Составление сюжетов</button>
        <button class="nav-btn" data-tab="section-2">Активности</button>
        <button class="nav-btn" data-tab="section-3">Атрибуты и материалы</button>
        <button class="nav-btn" data-tab="section-4">Готовые сюжеты</button>
    </nav>

    <!-- Основной контейнер с отделами -->
    <main class="content-container">
        <!-- Отдел 1: Интерактивное полотно -->
        <section id="section-1" class="section-content active">
            <div class="toolbar">
                <button id="add-block-btn">+ Добавить блок</button>
            </div>
            <div id="canvas"></div>
        </section>

        <!-- Отдел 2: Пока пустой -->
        <section id="section-2" class="section-content">
            <!-- Место для будущего контента -->
        </section>

        <!-- Отдел 3: Пока пустой -->
        <section id="section-3" class="section-content">
            <!-- Раздел с кнопками -->
    <div>
        <h2>Отдел 3: Атрибуты</h2>
        <button id="add-attr-btn" class="btn btn-primary">Добавить атрибут</button>
        <button id="delete-attr-btn" class="btn btn-danger">Удалить атрибут</button>
    </div>

    <!-- Всплывающее окно (Модалка) -->
    <div id="attr-modal" class="modal-overlay">
        <div class="modal-content">
            <h3>Новый атрибут</h3>
            
            <div class="form-group">
                <label>Фото:</label>
                <input type="file" id="attr-photo" accept="image/*">
            </div>
            
            <div class="form-group">
                <label>Название:</label>
                <input type="text" id="attr-name" placeholder="Введите название">
            </div>
            
            <div class="form-group">
                <label>Количество:</label>
                <input type="number" id="attr-quantity" placeholder="0">
            </div>
            
            <div class="form-group">
                <label>Описание:</label>
                <textarea id="attr-desc" rows="2" placeholder="Краткое описание"></textarea>
            </div>
            
            <div class="form-group">
                <label>Заметка:</label>
                <textarea id="attr-note" rows="2" placeholder="Дополнительная информация"></textarea>
            </div>

            <div class="modal-actions">
                <button id="cancel-btn" class="btn btn-secondary">Отменить</button>
                <button id="save-btn" class="btn btn-primary">Сохранить</button>
            </div>
        </div>
    </div>
        </section>
    </main>

    <script src="script/script.js"></script>
</body>
</html>
